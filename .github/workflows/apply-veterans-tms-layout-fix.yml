name: Apply Veterans TMS layout fix

on:
  push:
    paths:
      - '.github/workflows/apply-veterans-tms-layout-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update image paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/(frontend)/veterans-tms-treatment/page.tsx')
          s = p.read_text()
          s = s.replace('/media/images/veterans-mountain.webp','/media/images/veterans-mountain.jpg')
          s = s.replace('/media/images/vac-canadian-flag.webp','/media/images/Canadian-flag.png')
          p.write_text(s)
          PY
      - name: Append layout corrections
        shell: bash
        run: |
          echo '' | base64 -d >> 'src/app/(frontend)/veterans-tms-treatment/veterans-tms-refinements.css'
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/apply-veterans-tms-layout-fix.yml'
          git add -A
          git commit -m 'Fix Veterans TMS imagery and final layout'
          git push origin HEAD:main
