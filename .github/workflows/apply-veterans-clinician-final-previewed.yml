name: Apply previewed Veterans psychiatrist layout

on:
  push:
    paths:
      - '.github/workflows/apply-veterans-clinician-final-previewed.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append validated psychiatrist layout overrides
        shell: bash
        run: |
          cat >> 'src/app/(frontend)/veterans-tms-treatment/veterans-tms-refinements.css' <<'CSS'

/* VALIDATED PSYCHIATRIST COMPOSITION 2026-09-13 */
.vtms-clinician .vtms-split{
  display:grid!important;
  grid-template-columns:minmax(0,44%) minmax(0,56%)!important;
  gap:0!important;
  align-items:stretch!important;
  overflow:hidden!important;
  border-radius:18px!important;
  background:#f3efe7!important;
  box-shadow:0 20px 52px rgba(31,54,68,.12)!important;
}
.vtms-clinician .vtms-photo-card{
  min-height:520px!important;
  aspect-ratio:auto!important;
  border-radius:0!important;
  box-shadow:none!important;
  background:#dce5eb!important;
}
.vtms-clinician .vtms-photo-card>.vtms-cover{
  object-fit:cover!important;
  object-position:95% center!important;
  transform:none!important;
}
.vtms-clinician .vtms-photo-card::after{
  background:linear-gradient(90deg,rgba(8,33,49,.60) 0%,rgba(8,33,49,.30) 30%,rgba(8,33,49,.07) 48%,rgba(8,33,49,0) 62%)!important;
}
.vtms-clinician .vtms-clinician-quote{
  left:28px!important;
  top:34px!important;
  width:min(34%,180px)!important;
}
.vtms-clinician .vtms-clinician-quote blockquote{
  font-size:clamp(1rem,1.25vw,1.28rem)!important;
  line-height:1.18!important;
}
.vtms-clinician .vtms-clinician-quote span{
  font-size:.78rem!important;
}
.vtms-clinician .vtms-copy{
  padding:56px 50px 52px!important;
  display:flex!important;
  flex-direction:column!important;
  justify-content:center!important;
  background:#f3efe7!important;
}

@media(max-width:900px){
  .vtms-clinician .vtms-split{
    grid-template-columns:1fr!important;
    border-radius:16px!important;
  }
  .vtms-clinician .vtms-photo-card{
    min-height:0!important;
    aspect-ratio:.8/1!important;
  }
  .vtms-clinician .vtms-photo-card>.vtms-cover{
    object-fit:cover!important;
    object-position:100% center!important;
  }
  .vtms-clinician .vtms-photo-card::after{
    background:linear-gradient(90deg,rgba(8,33,49,.62) 0%,rgba(8,33,49,.32) 28%,rgba(8,33,49,.08) 46%,rgba(8,33,49,0) 58%)!important;
  }
  .vtms-clinician .vtms-clinician-quote{
    left:22px!important;
    top:28px!important;
    width:36%!important;
  }
  .vtms-clinician .vtms-clinician-quote blockquote{
    font-size:1rem!important;
    line-height:1.16!important;
  }
  .vtms-clinician .vtms-copy{
    padding:42px 30px 38px!important;
  }
}

@media(max-width:560px){
  .vtms-clinician .vtms-photo-card{
    aspect-ratio:.8/1!important;
  }
  .vtms-clinician .vtms-photo-card>.vtms-cover{
    object-position:100% center!important;
  }
  .vtms-clinician .vtms-clinician-quote{
    left:18px!important;
    top:24px!important;
    width:34%!important;
  }
  .vtms-clinician .vtms-clinician-quote blockquote{
    font-size:.94rem!important;
    line-height:1.16!important;
  }
  .vtms-clinician .vtms-clinician-quote span{
    font-size:.68rem!important;
  }
  .vtms-clinician .vtms-copy{
    padding:36px 22px 34px!important;
  }
}
CSS

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/apply-veterans-clinician-final-previewed.yml'
          git add 'src/app/(frontend)/veterans-tms-treatment/veterans-tms-refinements.css'
          git commit -m 'Refine previewed Veterans psychiatrist composition'
          git push origin HEAD:main
