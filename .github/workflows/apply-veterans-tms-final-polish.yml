name: Apply Veterans TMS final polish

on:
  push:
    paths:
      - '.github/workflows/apply-veterans-tms-final-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append final CSS refinements
        run: |
          echo '' | base64 -d >> 'src/app/(frontend)/veterans-tms-treatment/veterans-tms-refinements.css'
          git rm '.github/workflows/apply-veterans-tms-final-polish.yml'
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(frontend)/veterans-tms-treatment/veterans-tms-refinements.css' '.github/workflows/apply-veterans-tms-final-polish.yml'
          git commit -m 'Polish Veterans TMS responsive layout'
          git push origin HEAD:main
