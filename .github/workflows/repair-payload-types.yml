name: Repair Payload types

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-types:
    if: github.head_ref == 'chatgpt/veterans-tms-landing'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate Payload types
        run: npm run generate:types
      - name: Commit generated types
        run: |
          if git diff --quiet -- src/payload-types.ts; then
            echo "Payload types are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payload-types.ts
          git commit -m "Sync generated Payload types"
          git push origin HEAD:${{ github.head_ref }}
