name: Refactor Insights Admin Audit

on:
  push:
    branches:
      - chatgpt/ai-progress-multi-source

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic AI assistant refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/payload/components/AIArticleAssistant.tsx')
          s = p.read_text()
          s = s.replace('import { useAllFormFields } from "@payloadcms/ui";', 'import { useAllFormFields, useDocumentInfo } from "@payloadcms/ui";')
          marker = '} from "@/ai/schemas";\n\nconst MAX_SOURCE_FILES = 10;\nconst MAX_SOURCE_FILE_BYTES = 4 * 1024 * 1024;'
          replacement = '''} from "@/ai/schemas";\nimport {\n  AI_SOURCE_ACCEPT,\n  MAX_AI_SOURCE_FILES,\n  MAX_AI_SOURCE_FILE_BYTES,\n  normalizedSourceMimeType,\n  nextEstimatedGenerationProgress,\n  uploadProgressPercent,\n  validateSourceSelection,\n} from "@/ai/source-files";'''
          s = s.replace(marker, replacement)

          old = '''function paragraphNode(text: string) {\n  return { children: text ? [textNode(text)] : [], direction: "ltr", format: "", indent: 0, type: "paragraph", version: 1, textFormat: 0, textStyle: "" };\n}\nfunction headingNode(text: string, level: 2 | 3 = 2) {\n  return { children: [textNode(text)], direction: "ltr", format: "", indent: 0, tag: level === 3 ? "h3" : "h2", type: "heading", version: 1 };\n}\nfunction draftToLexical(draft: ArticleDraft) {\n  const children: unknown[] = [];\n  for (const section of draft.sections) {\n    if (section.heading?.trim()) children.push(headingNode(section.heading.trim(), section.level === 3 ? 3 : 2));\n    for (const paragraph of section.paragraphs) if (paragraph.trim()) children.push(paragraphNode(paragraph.trim()));\n    for (const bullet of section.bullets || []) if (bullet.trim()) children.push(paragraphNode(`• ${bullet.trim()}`));\n  }\n  return { root: { children, direction: "ltr", format: "", indent: 0, type: "root", version: 1 } };\n}'''
          new = '''function paragraphNode(text: string) {\n  return { children: text ? [textNode(text)] : [], direction: "ltr", format: "", indent: 0, type: "paragraph", version: 1, textFormat: 0, textStyle: "" };\n}\nfunction headingNode(text: string, level: 2 | 3 = 2) {\n  return { children: [textNode(text)], direction: "ltr", format: "", indent: 0, tag: level === 3 ? "h3" : "h2", type: "heading", version: 1 };\n}\nfunction bulletListNode(items: string[]) {\n  return {\n    children: items.map((text, index) => ({\n      children: [textNode(text)],\n      direction: "ltr",\n      format: "",\n      indent: 0,\n      type: "listitem",\n      version: 1,\n      value: index + 1,\n    })),\n    direction: "ltr",\n    format: "",\n    indent: 0,\n    listType: "bullet",\n    start: 1,\n    tag: "ul",\n    type: "list",\n    version: 1,\n  };\n}\nexport function draftToLexical(draft: ArticleDraft) {\n  const children: unknown[] = [];\n  for (const section of draft.sections) {\n    if (section.heading?.trim()) children.push(headingNode(section.heading.trim(), section.level === 3 ? 3 : 2));\n    for (const paragraph of section.paragraphs) if (paragraph.trim()) children.push(paragraphNode(paragraph.trim()));\n    const bullets = (section.bullets || []).map((bullet) => bullet.trim()).filter(Boolean);\n    if (bullets.length) children.push(bulletListNode(bullets));\n  }\n  return { root: { children, direction: "ltr", format: "", indent: 0, type: "root", version: 1 } };\n}'''
          s = s.replace(old, new)

          s = s.replace('''export function AIArticleAssistant() {\n  const pathname = usePathname();\n  const [fields, dispatchFields] = useAllFormFields();''', '''export function AIArticleAssistant() {\n  const pathname = usePathname();\n  const { id: documentId, collectionSlug } = useDocumentInfo();\n  const [fields, dispatchFields] = useAllFormFields();''')
          s = s.replace('''  const sourceSession = fieldValue(fields, "aiSourceSession");\n\n  useEffect(() => {''', '''  const sourceSession = fieldValue(fields, "aiSourceSession");\n  const currentDocumentKey = `${collectionSlug || "insights"}:${documentId ?? "new"}:${pathname}`;\n\n  useEffect(() => {''')
          s = s.replace('''  }, [pathname]);''', '''  }, [pathname, documentId, collectionSlug]);''', 1)
          s = s.replace('''    if (generatedForPath && generatedForPath !== pathname) {''', '''    if (generatedForPath && generatedForPath !== currentDocumentKey) {''')

          old_confirm = '''    const replacingDifferentArticle = current.title.trim() && current.title.trim() !== draft.title.trim();\n    if (replacingDifferentArticle && !window.confirm(`Replace the current article “${current.title}” with the proposed AI draft “${draft.title}”? This changes the title, slug, summary, body and SEO fields.`)) return;'''
          new_confirm = '''    const currentLabel = current.title.trim() ? `“${current.title}”` : "this Insight";\n    if (!window.confirm(`Replace ${currentLabel} with the proposed AI draft “${draft.title}”? This changes the title, slug, summary, body and SEO fields.`)) return;'''
          s = s.replace(old_confirm, new_confirm)

          old_upload = '''      const form = new FormData();\n      form.append("file", file);\n      form.append("_payload", JSON.stringify({ sessionId }));'''
          new_upload = '''      const mimeType = normalizedSourceMimeType(file.name, file.type);\n      if (!mimeType) { reject(new Error(`${file.name} is not a supported source file.`)); return; }\n      const normalizedFile = file.type === mimeType ? file : new File([file], file.name, { type: mimeType, lastModified: file.lastModified });\n      const form = new FormData();\n      form.append("file", normalizedFile);\n      form.append("_payload", JSON.stringify({ sessionId }));'''
          s = s.replace(old_upload, new_upload)
          s = s.replace('''        const percent = 5 + ((index + fraction) / Math.max(total, 1)) * 45;\n        setProgress(Math.min(50, Math.round(percent)));''', '''        setProgress(uploadProgressPercent(index, fraction, total));''')

          old_validation = '''      if (sourceDocuments.length + sourceFiles.length > MAX_SOURCE_FILES) throw new Error(`Use up to ${MAX_SOURCE_FILES} source files for one article.`);\n      const oversized = sourceFiles.find((file) => file.size > MAX_SOURCE_FILE_BYTES);\n      if (oversized) throw new Error(`${oversized.name} is larger than 4 MB. Split or compress that source file before uploading.`);'''
          new_validation = '''      if (sourceDocuments.length + sourceFiles.length > MAX_AI_SOURCE_FILES) throw new Error(`Use up to ${MAX_AI_SOURCE_FILES} source files for one article.`);\n      const existingBytes = sourceDocuments.reduce((sum, doc) => sum + (doc.filesize || 0), 0);\n      const selectionError = validateSourceSelection(existingBytes, sourceFiles);\n      if (selectionError) throw new Error(selectionError);'''
          s = s.replace(old_validation, new_validation)
          s = s.replace('''      setProgress(55);\n      setProgressLabel(uploaded.length ? `Reading ${uploaded.length} source file${uploaded.length === 1 ? "" : "s"} and generating article…` : "Generating article…");\n      ticker = setInterval(() => setProgress((value) => (value < 94 ? Math.min(94, value + (value < 75 ? 2 : 1)) : value)), 900);''', '''      setProgress(35);\n      setProgressLabel("Preparing article request…");\n      await new Promise((resolve) => setTimeout(resolve, 120));\n      setProgress(40);\n      setProgressLabel(uploaded.length ? `Reading ${uploaded.length} source file${uploaded.length === 1 ? "" : "s"} and generating article…` : "Generating article…");\n      ticker = setInterval(() => setProgress(nextEstimatedGenerationProgress), 900);''')
          s = s.replace('''      const json = await response.json() as { error?: string; result?: ArticleDraft | SEOReview };''', '''      setProgress(95);\n      setProgressLabel("Validating and formatting response…");\n      const json = await response.json() as { error?: string; result?: ArticleDraft | SEOReview };''')
          s = s.replace('''      setGeneratedForPath(pathname);''', '''      setGeneratedForPath(currentDocumentKey);''')

          s = s.replace('''accept=".pdf,.txt,.md,.doc,.docx,application/pdf,text/plain,text/markdown,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"''', '''accept={AI_SOURCE_ACCEPT}''')
          s = s.replace('''MAX_SOURCE_FILES - sourceDocuments.length''', '''MAX_AI_SOURCE_FILES - sourceDocuments.length''')
          s = s.replace('''Select up to {MAX_SOURCE_FILES} PDF/TXT/MD/DOC/DOCX files. Files are uploaded one at a time when you run the AI, avoiding the combined-request size limit. Current per-file limit: 4 MB.''', '''Select up to {MAX_AI_SOURCE_FILES} PDF/TXT/MD/DOC/DOCX files. Files upload one at a time when you run the AI. Limit: 4 MB per file and 20 MB combined.''')
          s = s.replace('''{busy && progress >= 55 &&''', '''{busy && progress >= 40 &&''')

          if 'MAX_SOURCE_FILES' in s or 'MAX_SOURCE_FILE_BYTES' in s:
            raise SystemExit('old source constants remain')
          p.write_text(s)
          PY
      - name: Commit refactor
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payload/components/AIArticleAssistant.tsx
          git commit -m "Harden AI assistant document state and progress"
          git push
