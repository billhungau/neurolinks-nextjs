name: Apply Veterans portrait preview

on:
  push:
    paths:
      - '.github/workflows/apply-veterans-portrait-preview.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veterans-portrait-preview
          fetch-depth: 0

      - name: Update portrait markup and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/(frontend)/veterans-tms-treatment/page.tsx')
          s = p.read_text()
          s = s.replace('import "./veterans-tms-refinements.css";','import "./veterans-tms-refinements.css";\nimport "./veterans-portrait-natural.css";')
          old = '''            <div className="vtms-photo-card">\n              <Image src="/media/images/Portrait for veterans page.png" alt="Dr. Chi Hung Au, psychiatrist and founder of NeuroLinks" fill sizes="(max-width: 800px) 100vw, 45vw" className="vtms-cover" />'''
          new = '''            <div className="vtms-photo-card vtms-portrait-natural">\n              <div className="vtms-portrait-image-wrap">\n                <Image src="/media/images/Portrait for veterans page.png" alt="Dr. Chi Hung Au, psychiatrist and founder of NeuroLinks" width={768} height={768} sizes="(max-width: 900px) calc(100vw - 44px), 42vw" className="vtms-clinician-photo" />\n              </div>'''
          if old not in s:
              raise SystemExit('portrait markup target not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

          cat > 'src/app/(frontend)/veterans-tms-treatment/veterans-portrait-natural.css' <<'CSS'
          /* Preview-only deterministic portrait layout. Loaded after all legacy refinements. */
          .vtms-clinician .vtms-split{
            display:grid!important;
            grid-template-columns:minmax(0,42%) minmax(0,58%)!important;
            gap:0!important;
            align-items:center!important;
            overflow:hidden;
            border-radius:18px;
            background:#f3efe7;
            box-shadow:0 20px 52px rgba(31,54,68,.12);
          }
          .vtms-clinician .vtms-photo-card.vtms-portrait-natural{
            min-height:0!important;
            height:auto!important;
            aspect-ratio:auto!important;
            border-radius:0!important;
            box-shadow:none!important;
            background:#d9e3ea;
            align-self:center;
          }
          .vtms-portrait-image-wrap{
            position:relative;
            width:100%;
            overflow:hidden;
            line-height:0;
            background:#d9e3ea;
          }
          .vtms-clinician-photo{
            position:relative!important;
            display:block!important;
            width:100%!important;
            height:auto!important;
            max-width:none!important;
            object-fit:contain!important;
          }
          .vtms-clinician .vtms-photo-card::after{
            background:linear-gradient(90deg,rgba(8,33,49,.56) 0%,rgba(8,33,49,.26) 29%,rgba(8,33,49,.06) 48%,rgba(8,33,49,0) 62%)!important;
          }
          .vtms-clinician .vtms-clinician-quote{
            left:28px!important;
            top:30px!important;
            width:min(38%,190px)!important;
          }
          .vtms-clinician .vtms-clinician-quote blockquote{
            font-size:clamp(1rem,1.35vw,1.28rem)!important;
            line-height:1.17!important;
          }
          .vtms-clinician .vtms-copy{
            padding:48px 50px 44px!important;
            display:flex;
            flex-direction:column;
            justify-content:center;
            background:#f3efe7;
          }

          @media(max-width:900px){
            .vtms-clinician .vtms-split{
              grid-template-columns:1fr!important;
              align-items:stretch!important;
            }
            .vtms-clinician .vtms-photo-card.vtms-portrait-natural{
              width:100%;
            }
            .vtms-portrait-image-wrap{
              aspect-ratio:1.22/1;
            }
            .vtms-clinician-photo{
              width:116%!important;
              height:auto!important;
              transform:translateX(-13%);
            }
            .vtms-clinician .vtms-clinician-quote{
              left:24px!important;
              top:26px!important;
              width:min(36%,175px)!important;
            }
            .vtms-clinician .vtms-copy{
              padding:42px 32px 38px!important;
            }
          }

          @media(max-width:560px){
            .vtms-portrait-image-wrap{
              aspect-ratio:1.16/1;
            }
            .vtms-clinician-photo{
              width:114%!important;
              transform:translateX(-12%);
            }
            .vtms-clinician .vtms-clinician-quote{
              left:18px!important;
              top:20px!important;
              width:34%!important;
            }
            .vtms-clinician .vtms-clinician-quote blockquote{
              font-size:.92rem!important;
            }
            .vtms-clinician .vtms-clinician-quote span{
              font-size:.70rem!important;
            }
            .vtms-clinician .vtms-copy{
              padding:34px 22px 32px!important;
            }
          }
          CSS

      - name: Commit preview changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/apply-veterans-portrait-preview.yml'
          git add 'src/app/(frontend)/veterans-tms-treatment/page.tsx' 'src/app/(frontend)/veterans-tms-treatment/veterans-portrait-natural.css'
          git commit -m 'Preview deterministic Veterans portrait layout'
          git push origin HEAD:fix/veterans-portrait-preview
