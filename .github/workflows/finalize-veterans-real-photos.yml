name: Finalize Veterans Real Photos

on:
  push:
    branches:
      - chatgpt/veterans-tms-real-photos

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/veterans-tms-real-photos
      - name: Use uploaded WebP photos
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/(frontend)/veterans-tms-treatment/page.tsx')
          s = p.read_text()
          s = s.replace('/media/images/veterans-mountain-purpose.svg', '/media/images/veterans-mountain.webp')
          s = s.replace('/media/images/vac-canadian-flag.svg', '/media/images/vac-canadian-flag.webp')
          s = s.replace('Canadian flag overlooking a coastal British Columbia landscape', 'Canadian flag overlooking Nanaimo and the coast from Mount Benson')
          p.write_text(s)
          PY
          rm .github/workflows/finalize-veterans-real-photos.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/\(frontend\)/veterans-tms-treatment/page.tsx .github/workflows/finalize-veterans-real-photos.yml
          git commit -m "Use uploaded photos on Veterans TMS landing page"
          git push origin HEAD:chatgpt/veterans-tms-real-photos
