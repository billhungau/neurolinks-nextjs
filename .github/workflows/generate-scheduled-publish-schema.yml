name: Generate scheduled publish schema

on:
  push:
    branches:
      - chatgpt/insights-scheduled-publishing

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/insights-scheduled-publishing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Payload types and migration
        run: |
          npx payload generate:types
          npx payload migrate:create scheduled_publish
      - name: Commit generated schema and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-scheduled-publish-schema.yml
          git add src/payload-types.ts src/payload/migrations
          git commit -m "Generate scheduled publishing schema"
          git push origin HEAD:chatgpt/insights-scheduled-publishing
