name: Insights CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Full regression gate for the Insights CMS, references, and AI Article Assistant.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Payload generated types are current
        run: npm run check:payload-types
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Next.js build
        run: npm run build
      - name: Start built app
        run: |
          npm start > /tmp/neurolinks-next.log 2>&1 &
          echo $! > /tmp/neurolinks-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/neurolinks-next.log
          exit 1
      - name: SEO verification
        run: npm run verify:seo
      - name: Stop built app
        if: always()
        run: |
          if [ -f /tmp/neurolinks-next.pid ]; then
            kill "$(cat /tmp/neurolinks-next.pid)" 2>/dev/null || true
          fi
