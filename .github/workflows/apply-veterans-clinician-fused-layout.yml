name: Apply Veterans psychiatrist fused layout

on:
  push:
    paths:
      - '.github/workflows/apply-veterans-clinician-fused-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append psychiatrist section layout overrides
        shell: bash
        run: echo '' | base64 --decode >> 'src/app/(frontend)/veterans-tms-treatment/veterans-tms-refinements.css'
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/apply-veterans-clinician-fused-layout.yml'
          git add 'src/app/(frontend)/veterans-tms-treatment/veterans-tms-refinements.css'
          git commit -m 'Fuse Veterans psychiatrist portrait and care section'
          git push origin HEAD:main
